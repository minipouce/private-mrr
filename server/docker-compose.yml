services:
  mrr:
    build: .
    container_name: mrr-server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8791
      DB_PATH: /data/mrr.db
      LOGO_DIR: /data/logos
      FCM_SERVICE_ACCOUNT_PATH: /run/secrets/fcm-service-account.json
    volumes:
      - mrr-data:/data
      # Firebase key mounted read-only: it never enters the image, which would
      # otherwise land it in a registry or a layer cache.
      - ./credentials/fcm-service-account.json:/run/secrets/fcm-service-account.json:ro
    # Published on loopback only: the container is reachable through the host's
    # reverse proxy alone, never directly from the internet.
    ports:
      - "127.0.0.1:8791:8791"
    security_opt:
      - no-new-privileges:true
    # The data volume is the only path that needs to stay writable.
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mrr-data:
